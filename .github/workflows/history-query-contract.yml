name: history-query-contract

on:
  pull_request:
    paths:
      - server.py
      - api_server/utils/query_params.py
      - tests-unit/server/utils/history_query_validation_contract_test.py
      - .github/workflows/history-query-contract.yml
  push:
    branches:
      - codex/history-query-validation-refresh-20260724

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest tests-unit/server/utils/history_query_validation_contract_test.py -q
