name: verify-history-query-fix

on:
  push:
    branches:
      - codex/history-query-validation-refresh-20260724
    paths:
      - .github/workflows/verify-history-query-fix.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/history-query-validation-refresh-20260724
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify focused regression and helper tests
        run: |
          python -m pytest \
            tests-unit/server/utils/history_query_validation_contract_test.py \
            tests-unit/server/utils/query_params_test.py \
            -q
          python -m py_compile api_server/utils/query_params.py server.py tests-unit/server/utils/query_params_test.py
      - name: Remove temporary repair workflow and static contract
        run: |
          rm -f .github/workflows/verify-history-query-fix.yml
          rm -f .github/workflows/history-query-contract.yml
          rm -f tests-unit/server/utils/history_query_validation_contract_test.py
      - name: Commit verified cleanup
        run: |
          git config user.name "grtninja-backlog-repair"
          git config user.email "214726997+grtninja@users.noreply.github.com"
          git add -A
          git commit -m "test: verify refreshed /history validation green"
          git push origin HEAD:codex/history-query-validation-refresh-20260724
